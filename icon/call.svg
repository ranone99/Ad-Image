<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- تدرج لوني أزرق عميق واحترافي للخلفية -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="55%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#0c4a6e" />
    </linearGradient>

    <!-- تدرج لبني ناعم للسماعة -->
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e0f2fe" />
      <stop offset="100%" stop-color="#7dd3fc" />
    </linearGradient>

    <!-- ظل خفيف لإعطاء عمق للسماعة -->
    <filter id="softShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.8" flood-color="#082f49" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- الخلفية الدائرية / المربعة الناعمة المتدرجة -->
  <rect x="2" y="2" width="60" height="60" rx="18" fill="url(#bgGrad)" />
  <!-- حد خفيف جداً يبرز الحواف -->
  <rect x="2.5" y="2.5" width="59" height="59" rx="17.5" fill="none" stroke="#38bdf8" stroke-opacity="0.35" stroke-width="1" />

  <!-- أيقونة السماعة متوسطة ومكبرة بشكل متوازن داخل الزر -->
  <g transform="translate(15, 15) scale(1.416)" filter="url(#softShadow)">
    <path fill="url(#iconGrad)" d="M12 1c-4.97 0-9 4.03-9 9v7c0 1.66 1.34 3 3 3h3v-8H5v-2c0-3.87 3.13-7 7-7s7 3.13 7 7v2h-4v8h3c1.66 0 3-1.34 3-3v-7c0-4.97-4.03-9-9-9z" />
  </g>
</svg>
